name: Release

# Cut a release by pushing a tag:
#   Node:    git tag netease-v1.0.0 && git push origin netease-v1.0.0
#   QuickJS: git tag netease-quickjs-v2.0.0 && git push origin netease-quickjs-v2.0.0
on:
  push:
    tags:
      - "netease-v[0-9]+.[0-9]+.[0-9]+*"
      - "netease-quickjs-v[0-9]+.[0-9]+.[0-9]+*"

permissions: {}

# Releases publish a merged index, so they must not race each other.
concurrency:
  group: release
  cancel-in-progress: false

env:
  INDEX_URL: https://github.com/thedavidweng/openkara-sources/releases/latest/download/source-index.json

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Check the tag matches the package version
        run: |
          case "$GITHUB_REF_NAME" in
            netease-quickjs-v*)
              pkg="netease-quickjs"
              version="${GITHUB_REF_NAME#netease-quickjs-v}"
              ;;
            netease-v*)
              pkg="netease"
              version="${GITHUB_REF_NAME#netease-v}"
              ;;
            *)
              echo "unrecognized release tag: $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac
          manifest="$(node -p "require('./packages/' + '$pkg' + '/manifest.json').version")"
          package="$(node -p "require('./packages/' + '$pkg' + '/package.json').version")"
          if [ "$version" != "$manifest" ] || [ "$version" != "$package" ]; then
            echo "tag version $version, manifest $manifest, package.json $package must all match" >&2
            exit 1
          fi
          echo "RELEASE_PACKAGE=$pkg" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - run: npm test

      - name: Test package
        run: |
          if [ "$RELEASE_PACKAGE" = "netease-quickjs" ]; then
            npm --prefix packages/netease-quickjs ci
            npm --prefix packages/netease-quickjs test
          fi

      - name: Build the package archive
        run: |
          mkdir -p dist
          if [ "$RELEASE_PACKAGE" = "netease-quickjs" ]; then
            npm --prefix packages/netease-quickjs ci
            npm --prefix packages/netease-quickjs run bundle
            python3 packages/netease-quickjs/tools/pack.py --out ../../dist
          else
            node scripts/build-package.mjs --package "$RELEASE_PACKAGE" --out dist
          fi

      - name: Fetch the previously published index
        run: |
          status="$(curl -sSL -o previous-index.json -w '%{http_code}' "$INDEX_URL")"
          case "$status" in
            200) echo "PREVIOUS_INDEX=previous-index.json" >> "$GITHUB_ENV" ;;
            404) rm -f previous-index.json ;;
            *) echo "unexpected HTTP $status fetching the previous index" >&2; exit 1 ;;
          esac

      - name: Build and sign the index
        env:
          OPENKARA_SOURCE_SIGNING_CURRENT_PRIVATE_KEY: ${{ secrets.OPENKARA_SOURCE_SIGNING_CURRENT_PRIVATE_KEY }}
        run: |
          node scripts/build-index.mjs --package "$RELEASE_PACKAGE" --archive "dist/openkara-source-netease-${RELEASE_VERSION}.tar.gz.meta.json" ${PREVIOUS_INDEX:+--previous "$PREVIOUS_INDEX"} --out dist/source-index.json --key-slot current
          node scripts/verify-index.mjs dist/source-index.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="NetEase source ${RELEASE_VERSION}"
          notes="NetEase Streaming Source package ${RELEASE_VERSION}. source-index.json carries every published release."
          if [ "$RELEASE_PACKAGE" = "netease-quickjs" ]; then
            title="NetEase QuickJS source ${RELEASE_VERSION}"
            notes="NetEase QuickJS Streaming Source package ${RELEASE_VERSION}. source-index.json carries every published release."
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/openkara-source-netease-${RELEASE_VERSION}.tar.gz" \
            dist/source-index.json \
            --title "$title" \
            --notes "$notes" \
            --verify-tag --latest

      # The latest/download redirect can lag a freshly created release.
      - name: Verify the published index
        run: |
          for _ in 1 2 3 4 5 6; do
            node scripts/verify-index.mjs "$INDEX_URL" && exit 0
            sleep 20
          done
          exit 1
