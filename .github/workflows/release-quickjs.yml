name: Release QuickJS Package

# Cut a release by pushing <source>-quickjs-v<version>, e.g. netease-quickjs-v2.0.0 or qqmusic-quickjs-v1.0.0.
on:
  push:
    tags: ["*-quickjs-v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release-quickjs
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Check the tag matches the package version
        run: |
          version="${GITHUB_REF_NAME##*-quickjs-v}"
          source="${GITHUB_REF_NAME%-quickjs-v*}"
          manifest="$(node -p "require('./packages/'+process.argv[1]+'-quickjs/manifest.json').version" "$source")"
          package="$(node -p "require('./packages/'+process.argv[1]+'-quickjs/package.json').version" "$source")"
          if [ "$version" != "$manifest" ] || [ "$version" != "$package" ]; then
            echo "tag version $version, manifest $manifest, package.json $package must all match" >&2
            exit 1
          fi

      - name: Build the package archive
        run: |
          source="${GITHUB_REF_NAME%-quickjs-v*}"
          cd "packages/${source}-quickjs"
          npm ci
          npm run pack

      - name: Verify archive against registry entry
        run: |
          version="${GITHUB_REF_NAME##*-quickjs-v}"
          source="${GITHUB_REF_NAME%-quickjs-v*}"
          archive="packages/${source}-quickjs/dist/openkara-source-${source}-${version}.tar.gz"
          node scripts/verify-registry.mjs --archive "$archive" --version "$version"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME##*-quickjs-v}"
          source="${GITHUB_REF_NAME%-quickjs-v*}"
          archive="packages/${source}-quickjs/dist/openkara-source-${source}-${version}.tar.gz"
          gh release create "$GITHUB_REF_NAME" \
            "$archive" \
            --title "$source QuickJS source $version" \
            --notes "$source QuickJS Streaming Source package $version for OpenKara 0.19+." \
            --verify-tag --latest=false
