name: Release QuickJS Package

# Cut a release by pushing a tag: git tag netease-quickjs-v2.0.0 && git push origin netease-quickjs-v2.0.0
on:
  push:
    tags: ["netease-quickjs-v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release-quickjs
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1

      - name: Check the tag matches the package version
        run: |
          version="${GITHUB_REF_NAME#netease-quickjs-v}"
          manifest="$(node -p "require('./packages/netease-quickjs/manifest.json').version")"
          package="$(node -p "require('./packages/netease-quickjs/package.json').version")"
          if [ "$version" != "$manifest" ] || [ "$version" != "$package" ]; then
            echo "tag version $version, manifest $manifest, package.json $package must all match" >&2
            exit 1
          fi

      - name: Build the package archive
        run: |
          cd packages/netease-quickjs
          npm ci
          npm run pack

      - name: Verify archive against registry entry
        run: |
          version="${GITHUB_REF_NAME#netease-quickjs-v}"
          archive="packages/netease-quickjs/dist/openkara-source-netease-${version}.tar.gz"
          node scripts/verify-registry.mjs --archive "$archive" --version "$version"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#netease-quickjs-v}"
          archive="packages/netease-quickjs/dist/openkara-source-netease-${version}.tar.gz"
          gh release create "$GITHUB_REF_NAME" \
            "$archive" \
            --title "NetEase QuickJS source $version" \
            --notes "NetEase QuickJS Streaming Source package $version for OpenKara 0.19+." \
            --verify-tag --latest=false
